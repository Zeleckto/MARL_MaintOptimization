seed: 42
stochasticity_level: 1            # 1=deterministic, 2=+LogNormal noise, 3=+Poisson arrivals

# --- Environment -------------------------------------------------------------
environment:
  n_parallel_envs: 4
  max_jobs_in_system: 50

# --- Episode -----------------------------------------------------------------
episode:
  t_max_train: 150                 # 150 shifts * 8h = 1200 simulated hours
  t_max_eval:  300
  dt_hours:    8.0                 # 1 shift = 8 hours

# --- Weibull + Kijima degradation --------------------------------------------
degradation:
  dt_hours: 8.0
  q_fixed:  0.5                   # Kijima Type I: q=0 perfect repair, q=1 minimal repair
  alpha_q:  5.0                   # Beta(alpha_q, beta_q) for Phase 3 stochastic q
  beta_q:   5.0

# --- Machines (5 machines, Weibull beta and eta calibrated) ------------------
# Health model: H(t) = 100 * exp(-(effective_age/eta)^beta)   [Weibull survival]
#   H=80% -> 80% survival probability, 20% cumulative failure probability
#   h_critical=10%: backstop at 90% cumulative failure prob -> deterministic FAIL
#
# h_PM_threshold REMOVED: agent learns optimal PM timing from reward signal
#   (DELTA-RUL + failure penalty, design doc Sec 6.2 + Q2)
#
# delta_h / h_restore_PM/CM: kept for legacy code compatibility, NOT used in physics
#   (health is Weibull survival, not a linear counter)
#
# MTBF = eta * Gamma(1 + 1/beta) per machine
machines:
  - machine_id: 0
    name: CNC Mill
    type: A
    beta: 2.8
    eta:  900.0                   # MTBF ~100 shifts -> ~1.5 failures/ep at full util
    delta_h: 0.4                  # legacy, unused
    h_critical: 10.0              # deterministic failure backstop (90% cumul fail prob)
    tau_PM_shifts: 2
    tau_CM_shifts: 6
    h_restore_PM: 35.0            # legacy, unused
    h_restore_CM: 65.0

  - machine_id: 1
    name: Lathe
    type: A
    beta: 2.2
    eta:  1100.0                  # MTBF ~122 shifts -> ~1.2 failures/ep
    delta_h: 0.35
    h_critical: 10.0
    tau_PM_shifts: 2
    tau_CM_shifts: 5
    h_restore_PM: 32.0
    h_restore_CM: 60.0

  - machine_id: 2
    name: Grinder
    type: B
    beta: 3.0
    eta:  700.0                   # MTBF ~78 shifts -> ~1.9 failures/ep (highest risk)
    delta_h: 0.5
    h_critical: 10.0
    tau_PM_shifts: 3
    tau_CM_shifts: 8
    h_restore_PM: 40.0
    h_restore_CM: 70.0

  - machine_id: 3
    name: Press
    type: C
    beta: 3.2
    eta:  1000.0                  # MTBF ~112 shifts -> ~1.3 failures/ep
    delta_h: 0.42
    h_critical: 10.0
    tau_PM_shifts: 2
    tau_CM_shifts: 6
    h_restore_PM: 36.0
    h_restore_CM: 65.0

  - machine_id: 4
    name: CMM
    type: D
    beta: 2.5
    eta:  1350.0                  # MTBF ~150 shifts -> ~1.0 failures/ep
    delta_h: 0.3
    h_critical: 10.0
    tau_PM_shifts: 2
    tau_CM_shifts: 5
    h_restore_PM: 28.0
    h_restore_CM: 55.0

# --- Resources ---------------------------------------------------------------
resources:
  renewable:
    - resource_id: 0
      name: Technicians
      capacity: 3
    - resource_id: 1
      name: Tools
      capacity: 4
    - resource_id: 2
      name: Maintenance Bays
      capacity: 4
  consumable:
    - resource_id: 3
      name: Spare Parts
      initial_inventory: 20
      lead_time_shifts: 5
      reorder_cost: 10.0
    - resource_id: 4
      name: Lubricants
      initial_inventory: 15
      lead_time_shifts: 3
      reorder_cost: 5.0
    - resource_id: 5
      name: Consumable Tools
      initial_inventory: 10
      lead_time_shifts: 4
      reorder_cost: 8.0

# --- Reward (base values; full weights in rewards/reward_weights.yaml) --------
reward:
  c_fail: 25.0
  c_PM:   1.0
  c_CM:   7.0
  w_avail: 0.5
  w_tard: 1.0
  w_comp: 3.0
  w_health: 0.5
  lambda_shared: 0.3

# --- MAPPO hyperparameters ---------------------------------------------------
mappo:
  lr_actor1:       0.0001
  lr_actor2:       0.0003
  lr_critic:       0.001
  gamma:           0.99
  gae_lambda:      0.95
  clip_eps:        0.2
  entropy_coef:    0.01            # 5x higher than default -> prevents early collapse
  value_loss_coef: 0.5
  max_grad_norm:   0.5
  rollout_steps:   2048
  ppo_epochs:      10
  minibatch_size:  64

# --- TGIN (Agent 2 policy network) -------------------------------------------
tgin:
  n_layers:            3
  hidden_dim:          256
  eps:                 0.0
  op_feature_dim:      10
  machine_feature_dim: 14
  job_feature_dim:     7

# --- MLP Policy (Agent 1) ----------------------------------------------------
mlp_policy:
  hidden_dims: [256, 256]

# --- Centralized Critic ------------------------------------------------------
critic:
  hidden_dims: [512, 256]

# --- Job Shop (design doc Sec 2) ---------------------------------------------
# Utilisation rho = J * Y_avg * mean_proc / (M * T * A)
#                 = 40 * 4 * 5.0 / (5 * 150 * 0.946) = 112.8%
#                 tight load -> some tardiness guaranteed -> real scheduling pressure
#
# Processing times [16,64]h = [2,8] shifts (design doc Sec 2.3, Fattahi et al. 2010)
#   2 shifts: light CNC machining (turning, drilling, basic milling)
#   8 shifts: heavy precision work (large die machining, turbine blade grinding)
jobs:
  n_jobs_train:        40
  n_ops_per_job_min:   2
  n_ops_per_job_max:   6
  proc_time_min_hours: 16.0
  proc_time_max_hours: 64.0
  lambda_arr: 0.5                 # Phase 3 Poisson arrival rate (jobs/shift)

  # Op-type -> eligible machine IDs (42.9% = 15/35 pairs, design doc Sec 2.4)
  # 7 operation types * 5 machines. Each op type has >=1 eligible machine.
  # Bottlenecks: type 5 (Lathe only), type 6 (CMM only)
  # -> if M1 or M4 fails, those op types are blocked -> maintenance urgency
  op_type_compatibility:
    0: [0, 1, 2]                  # CNC Mill, Lathe, Grinder
    1: [0, 1, 3]                  # CNC Mill, Lathe, Press
    2: [2, 3, 4]                  # Grinder, Press, CMM
    3: [0, 1]                     # CNC Mill, Lathe
    4: [2, 3]                     # Grinder, Press
    5: [1]                        # Lathe only (single-machine bottleneck)
    6: [4]                        # CMM only   (single-machine bottleneck)

# --- Processing time noise (Phase 2+) ----------------------------------------
processing:
  sigma_log: 0.15                 # LogNormal sigma for proc time noise (Phase 2+)

# --- Logging -----------------------------------------------------------------
# --- Logging -----------------------------------------------------------------
logging:
  tensorboard_dir:      "runs/"
  checkpoint_dir:       "checkpoints/"
  checkpoint_every_steps: 25000    # overwrite latest.pt every 50k steps
  milestone_every_steps:  50000  # permanent: step_100k.pt, step_200k.pt...
  log_every_n_episodes: 10