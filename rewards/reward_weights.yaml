# rewards/reward_weights.yaml
# ============================
# All reward coefficients in ONE place.
# Literature basis:
#   c_PM:c_CM:c_fail = 1:7:25
#   c_CM = 7 justified: break-even > c_PM / P(fail) = 1/0.162 = 6.17
#   c_fail = 25: 15-40x PM cost typical for discrete manufacturing
#   (Pintelon & Parodi-Herz 2008, Nakagawa 2005)
#
# ΔRUL calibration: w_RUL = 0.05 so PM reward ≈ PM cost
#   0.05 * 35_shifts_of_RUL = 1.75 ≈ c_PM = 1.0  ✓
#
# Holding cost: w_hold = 0.005 (consistent with EOQ theory)

# --- Maintenance costs (Agent 1) ---
c_PM:   1.0     # cost per PM action
c_CM:   7.0     # cost per CM action  (7x PM — literature grounded)
c_fail: 25.0    # cost per FAILURE    (25x PM — unplanned downtime)

# --- Ordering cost ---
delta:  0.5     # per-unit ordering cost multiplier

# --- Inventory holding cost ---
w_hold: 0.005   # per unit per step (prevents over-ordering)

# --- ΔRUL signal (Agent 1 dense reward) ---
# Fires every step: reward = w_RUL * (RUL_{t+1} - RUL_t) for each machine
# This gives Agent 1 a continuous signal toward preventive behavior.
w_RUL:  0.05

# --- System availability (Agent 1) ---
# w_avail fires every step based on fraction of OP machines
w_avail: 2.0

# --- Scheduling (Agent 2) ---
w_tard:   5.0   # weighted tardiness penalty coefficient
w_comp:   3.0   # completion bonus per job finished this step
w_health: 0.5   # health-aware dispatch bonus (prefer healthy machines)
w_slack:  0.2   # on-track bonus (ops with positive slack)

# --- Shared failure penalty ---
lambda_shared: 0.3   # fraction of R_shared credited to each agent

# --- Objective weights for metrics (not training rewards) ---
alpha:     1.0    # tardiness weight in total cost
gamma_obj: 1.0    # maintenance cost weight in total cost
delta_obj: 0.0    # ordering cost weight in total cost
